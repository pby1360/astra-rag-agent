# Neo4j 지식그래프 로컬 기동.
#   기동:  docker compose up -d
#   중지:  docker compose down
#   브라우저: http://localhost:7474  (계정 neo4j / astra-rag-password)
services:
  neo4j:
    image: neo4j:5-community
    container_name: astra-neo4j
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt (드라이버 연결)
    environment:
      - NEO4J_AUTH=neo4j/astra-rag-password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
